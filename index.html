<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إلى مريم ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050003;
            color: white;
        }

        /* =========================
           المشهد الرئيسي
        ========================= */

        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15)
                ),
                url("background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* الإضاءة المتحركة */

        .glow {
            position: absolute;
            inset: -20%;

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(150, 0, 35, 0.16),
                    transparent 35%
                );

            animation: glowMove 7s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes glowMove {
            from {
                transform: scale(1);
                opacity: 0.65;
            }

            to {
                transform: scale(1.12);
                opacity: 1;
            }
        }

        /* =========================
           النجوم
        ========================= */

        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: rgba(255, 180, 190, 0.9);

            box-shadow:
                0 0 8px rgba(255, 60, 90, 0.8),
                0 0 16px rgba(255, 40, 70, 0.35);

            animation:
                floatUp linear infinite,
                twinkle ease-in-out infinite alternate;
        }

        @keyframes floatUp {
            from {
                transform: translateY(30px);
            }

            to {
                transform: translateY(-120px);
            }
        }

        @keyframes twinkle {
            from {
                opacity: 0.15;
            }

            to {
                opacity: 1;
            }
        }

        /* =========================
           الشاشات
        ========================= */

        .screen {
            position: absolute;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            transition:
                opacity 0.9s ease,
                transform 0.9s ease;

            z-index: 5;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.06);
        }

        /* =========================
           محتوى الشاشة الأولى
        ========================= */

        .content {
            width: 100%;
            max-width: 500px;

            text-align: center;
        }

        .small-text {
            font-size: 15px;
            color: rgba(255, 220, 225, 0.75);

            letter-spacing: 2px;
            margin-bottom: 18px;

            animation: fadeDown 1.5s ease forwards;
        }

        .title {
            font-size: clamp(48px, 14vw, 85px);
            font-weight: 700;

            background:
                linear-gradient(
                    180deg,
                    #ffffff,
                    #ffd6dc,
                    #c92c4b
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 25px rgba(255, 30, 70, 0.2);

            animation:
                titleAppear 1.8s ease forwards;
        }

        .subtitle {
            margin-top: 15px;

            font-size: 17px;
            line-height: 1.9;

            color: rgba(255, 235, 238, 0.82);

            animation:
                fadeUp 2s ease forwards;
        }

        /* =========================
           الأزرار
        ========================= */

        .start-btn,
        .next-btn {
            margin-top: 35px;

            border: 1px solid rgba(255, 120, 140, 0.45);

            border-radius: 999px;

            padding: 15px 34px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    rgba(130, 0, 30, 0.75),
                    rgba(70, 0, 18, 0.85)
                );

            backdrop-filter: blur(10px);

            font-size: 17px;

            cursor: pointer;

            box-shadow:
                0 0 25px rgba(170, 0, 40, 0.25);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .start-btn:hover,
        .next-btn:hover {
            transform: translateY(-4px) scale(1.03);

            box-shadow:
                0 0 35px rgba(220, 20, 60, 0.45);
        }

        .start-btn:active,
        .next-btn:active {
            transform: scale(0.96);
        }

        /* =========================
           الشاشة الثانية
        ========================= */

        .second-content {
            width: 100%;
            max-width: 500px;

            text-align: center;

            animation:
                secondAppear 1.2s ease forwards;
        }

        .heart {
            font-size: 55px;

            margin-bottom: 20px;

            animation:
                heartbeat 1.6s ease-in-out infinite;
        }

        .second-title {
            font-size: clamp(32px, 9vw, 55px);

            margin-bottom: 20px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff,
                    #ffc5cf,
                    #c92c4b
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .second-text {
            font-size: 17px;

            line-height: 2;

            color:
                rgba(255, 235, 238, 0.85);
        }

        /* =========================
           الحركات
        ========================= */

        @keyframes titleAppear {
            from {
                opacity: 0;
                transform:
                    translateY(25px)
                    scale(0.95);

                filter: blur(8px);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter: blur(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform:
                    translateY(25px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform:
                    translateY(-20px);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0);
            }
        }

        @keyframes secondAppear {
            from {
                opacity: 0;
                transform:
                    translateY(30px)
                    scale(0.96);
            }

            to {
                opacity: 1;
                transform:
                    translateY(0)
                    scale(1);
            }
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        /* =========================
           الجوال
        ========================= */

        @media (max-width: 500px) {

            .content,
            .second-content {
                padding: 10px;
            }

            .title {
                font-size: 58px;
            }

            .subtitle,
            .second-text {
                font-size: 15px;
            }

            .start-btn,
            .next-btn {
                font-size: 16px;
                padding: 14px 30px;
            }
        }
    </style>
</head>

<body>

    <main class="scene">

        <!-- الإضاءة -->
        <div class="glow"></div>

        <!-- النجوم -->
        <div
            class="particles"
            id="particles">
        </div>


        <!-- =====================
             الشاشة الأولى
        ====================== -->

        <section
            class="screen"
            id="screenOne">

            <div class="content">

                <div class="small-text">
                    إلى شخص مميز جدًا...
                </div>

                <h1 class="title">
                    مريم
                </h1>

                <p class="subtitle">
                    هذه المرة ما هي مجرد رسالة...
                    <br>
                    هذه رحلة صغيرة صنعتها لكِ ❤️
                </p>

                <button
                    class="start-btn"
                    onclick="startJourney()">

                    ابدئي الرحلة ❤️

                </button>

            </div>

        </section>


        <!-- =====================
             الشاشة الثانية
        ====================== -->

        <section
            class="screen hidden"
            id="screenTwo">

            <div class="second-content">

                <div class="heart">
                    ❤️
                </div>

                <h2 class="second-title">
                    قبل ما نبدأ...
                </h2>

                <p class="second-text">
                    أبغى منكِ شيء واحد فقط...
                    <br><br>
                    خذي وقتك،
                    واضغطي على الزر لما تكونين مستعدة
                    لاكتشاف اللي خبأته لكِ.
                </p>

                <button
                    class="next-btn"
                    onclick="nextStep()">

                    أنا مستعدة ❤️

                </button>

            </div>

        </section>

    </main>


    <script>

        /* =========================
           إنشاء النجوم
        ========================= */

        const particlesContainer =
            document.getElementById("particles");

        for (let i = 0; i < 55; i++) {

            const particle =
                document.createElement("span");

            particle.className =
                "particle";

            particle.style.left =
                Math.random() * 100 + "%";

            particle.style.top =
                Math.random() * 100 + "%";

            const size =
                Math.random() * 3 + 1;

            particle.style.width =
                size + "px";

            particle.style.height =
                size + "px";

            particle.style.animationDuration =
                (Math.random() * 6 + 4) + "s";

            particle.style.animationDelay =
                (Math.random() * 5) + "s";

            particlesContainer.appendChild(
                particle
            );
        }


        /* =========================
           بداية الرحلة
        ========================= */

        function startJourney() {

            const screenOne =
                document.getElementById("screenOne");

            const screenTwo =
                document.getElementById("screenTwo");

            screenOne.classList.add("hidden");

            setTimeout(() => {

                screenTwo.classList.remove("hidden");

            }, 500);
        }


        /* =========================
           الخطوة التالية
           مؤقتًا
        ========================= */

        function nextStep() {

            alert("هنا تبدأ المرحلة التالية ❤️");

        }

    </script>

</body>
</html>
