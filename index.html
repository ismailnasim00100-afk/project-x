<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إلى مريم ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050003;
            color: white;
        }

        /* الخلفية */
        .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100svh;
            overflow: hidden;

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15)
                ),
                url("background.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* طبقة الإضاءة */
        .glow {
            position: absolute;
            inset: -20%;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(150, 0, 35, 0.16),
                    transparent 35%
                );

            animation: glowMove 7s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes glowMove {
            from {
                transform: scale(1);
                opacity: 0.65;
            }

            to {
                transform: scale(1.12);
                opacity: 1;
            }
        }

        /* النجوم والجزيئات */
        .particles {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(255, 180, 190, 0.9);
            box-shadow:
                0 0 8px rgba(255, 60, 90, 0.8),
                0 0 16px rgba(255, 40, 70, 0.35);

            animation:
                floatUp linear infinite,
                twinkle ease-in-out infinite alternate;
        }

        @keyframes floatUp {
            from {
                transform: translateY(30px);
            }

            to {
                transform: translateY(-120px);
            }
        }

        @keyframes twinkle {
            from {
                opacity: 0.15;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        /* المحتوى */
        .content {
            position: relative;
            z-index: 5;

            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 30px;
            text-align: center;
        }

        .small-text {
            font-size: 15px;
            color: rgba(255, 220, 225, 0.75);
            letter-spacing: 2px;
            margin-bottom: 18px;

            animation: fadeDown 1.5s ease forwards;
        }

        .title {
            font-size: clamp(42px, 12vw, 80px);
            font-weight: 700;

            background: linear-gradient(
                180deg,
                #ffffff,
                #ffd6dc,
                #c92c4b
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            text-shadow:
                0 0 25px rgba(255, 30, 70, 0.2);

            animation: titleAppear 1.8s ease forwards;
        }

        .subtitle {
            margin-top: 15px;
            max-width: 330px;

            font-size: 17px;
            line-height: 1.9;

            color: rgba(255, 235, 238, 0.82);

            animation: fadeUp 2s ease forwards;
        }

        /* الزر */
        .start-btn {
            margin-top: 35px;

            border: 1px solid rgba(255, 120, 140, 0.45);
            border-radius: 999px;

            padding: 15px 34px;

            color: white;
            background:
                linear-gradient(
                    135deg,
                    rgba(130, 0, 30, 0.75),
                    rgba(70, 0, 18, 0.85)
                );

            backdrop-filter: blur(10px);

            font-size: 17px;
            cursor: pointer;

            box-shadow:
                0 0 25px rgba(170, 0, 40, 0.25);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;

            animation: fadeUp 2.3s ease forwards;
        }

        .start-btn:hover {
            transform: translateY(-4px) scale(1.03);

            box-shadow:
                0 0 35px rgba(220, 20, 60, 0.45);
        }

        .start-btn:active {
            transform: scale(0.96);
        }

        /* الحركات */
        @keyframes titleAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* للجوال */
        @media (max-width: 500px) {
            .content {
                padding: 22px;
            }

            .title {
                font-size: 52px;
            }

            .subtitle {
                font-size: 15px;
            }

            .start-btn {
                font-size: 16px;
                padding: 14px 30px;
            }
        }
    </style>
</head>

<body>

    <main class="scene">

        <div class="glow"></div>

        <div class="particles" id="particles"></div>

        <section class="content">

            <div class="small-text">
                إلى شخص مميز جدًا...
            </div>

            <h1 class="title">
                مريم
            </h1>

            <p class="subtitle">
                هذه المرة ما هي مجرد رسالة...
                <br>
                هذه رحلة صغيرة صنعتها لكِ ❤️
            </p>

            <button class="start-btn" onclick="startJourney()">
                ابدئي الرحلة ❤️
            </button>

        </section>

    </main>

    <script>
        const particlesContainer =
            document.getElementById("particles");

        // إنشاء الجزيئات والنجوم
        for (let i = 0; i < 45; i++) {

            const particle =
                document.createElement("span");

            particle.className = "particle";

            particle.style.left =
                Math.random() * 100 + "%";

            particle.style.top =
                Math.random() * 100 + "%";

            const size =
                Math.random() * 3 + 1;

            particle.style.width =
                size + "px";

            particle.style.height =
                size + "px";

            particle.style.animationDuration =
                (Math.random() * 5 + 4) + "s";

            particle.style.animationDelay =
                (Math.random() * 5) + "s";

            particlesContainer.appendChild(particle);
        }

        function startJourney() {

            // مؤقتًا نعرض رسالة.
            // لاحقًا سنربط الزر بالصفحة الثانية.

            alert("الرحلة بدأت ❤️");
        }
    </script>

</body>
</html>
